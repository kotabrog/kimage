[package]
name = "kimage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small image IO crate built step by step with the Rust standard library."
repository = "https://github.com/kotabrog/kimage"
readme = "README.md"

[features]
default = ["bmp", "netpbm"]
bmp = []
netpbm = []

[dependencies]

[[example]]
name = "bmp_roundtrip"
required-features = ["bmp"]

[[example]]
name = "pam_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "pbm_ascii_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "pbm_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "pgm16_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "pgm_ascii_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "pgm_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "pnm_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "ppm16_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "ppm_ascii_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "ppm_multi_image_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "ppm_roundtrip"
required-features = ["netpbm"]

[[example]]
name = "top_level_encode_roundtrip"
required-features = ["bmp", "netpbm"]
